<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Una línea de tiempo con huellas: de 218 antes de Cristo a hoy">
  <defs>
    <path id="ruta" d="M18,150 C70,150 90,90 140,90 S210,140 250,110 S320,56 342,52"/>
  </defs>
  <!-- camino: sombra y línea punteada -->
  <use href="#ruta" fill="none" stroke="#2B1D14" stroke-width="12" opacity=".08" stroke-linecap="round"/>
  <use href="#ruta" fill="none" stroke="#8C2F39" stroke-width="2.6" stroke-dasharray="7 7" stroke-linecap="round"/>
  <!-- huellas (pares) a lo largo del camino -->
  <g fill="#2B1D14" opacity=".6">
    <ellipse cx="44" cy="146" rx="3.2" ry="5" transform="rotate(-80 44 146)"/><ellipse cx="56" cy="152" rx="3.2" ry="5" transform="rotate(-80 56 152)"/>
    <ellipse cx="100" cy="118" rx="3.2" ry="5" transform="rotate(-40 100 118)"/><ellipse cx="112" cy="104" rx="3.2" ry="5" transform="rotate(-40 112 104)"/>
    <ellipse cx="168" cy="98" rx="3.2" ry="5" transform="rotate(-100 168 98)"/><ellipse cx="180" cy="110" rx="3.2" ry="5" transform="rotate(-100 180 110)"/>
    <ellipse cx="226" cy="124" rx="3.2" ry="5" transform="rotate(-60 226 124)"/><ellipse cx="236" cy="112" rx="3.2" ry="5" transform="rotate(-60 236 112)"/>
    <ellipse cx="282" cy="86" rx="3.2" ry="5" transform="rotate(-50 282 86)"/><ellipse cx="294" cy="76" rx="3.2" ry="5" transform="rotate(-50 294 76)"/>
  </g>
  <!-- hitos con año -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2B1D14" text-anchor="middle">
    <circle cx="18" cy="150" r="5.5" fill="#8C2F39"/>
    <text x="30" y="176" font-weight="bold">218 a. C.</text>
    <text x="30" y="189" font-size="9.5" fill="#6b5a4a">llega el latín</text>
    <circle cx="140" cy="90" r="4.5" fill="#F4EBD9" stroke="#8C2F39" stroke-width="2"/>
    <text x="140" y="70" font-weight="bold">711</text>
    <text x="140" y="56" font-size="9.5" fill="#6b5a4a">ocho siglos de árabe</text>
    <circle cx="250" cy="110" r="4.5" fill="#F4EBD9" stroke="#8C2F39" stroke-width="2"/>
    <text x="250" y="138" font-weight="bold">1492</text>
    <text x="250" y="151" font-size="9.5" fill="#6b5a4a">cruza el mar</text>
    <circle cx="342" cy="52" r="6" fill="#8C2F39"/>
    <circle cx="342" cy="52" r="10.5" fill="none" stroke="#8C2F39" stroke-width="1.4" opacity=".45"/>
    <text x="322" y="30" font-weight="bold">hoy</text>
    <text x="322" y="16" font-size="9.5" fill="#6b5a4a">tú</text>
  </g>
  <!-- leyenda -->
  <text x="180" y="196" font-family="Georgia, serif" font-size="9.5" fill="#8C2F39" text-anchor="middle" letter-spacing=".08em">UN PASO = UN AÑO</text>
</svg>
