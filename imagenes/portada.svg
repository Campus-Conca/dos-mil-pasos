<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Un camino que serpentea de la playa al presente, con huellas y pequeños hitos">
  <defs>
    <path id="camino" d="M14,196 C70,196 60,150 110,146 S170,160 200,120 S250,70 300,72 S340,40 348,22"/>
  </defs>
  <!-- cielo y sol -->
  <circle cx="300" cy="46" r="18" fill="#E7C27A" opacity=".55"/>
  <circle cx="300" cy="46" r="11" fill="#E7C27A" opacity=".9"/>
  <!-- cerros lejanos -->
  <path d="M0,118 C40,96 70,100 100,112 S160,92 200,104 S260,84 300,96 S340,86 360,94 L360,130 L0,130 Z" fill="#2B1D14" opacity=".07"/>
  <path d="M0,136 C50,118 90,130 130,124 S200,110 250,126 S320,112 360,124 L360,150 L0,150 Z" fill="#2B1D14" opacity=".10"/>
  <!-- mar al pie -->
  <path d="M0,206 C20,200 40,212 60,206 S100,200 120,206 S160,212 180,206" fill="none" stroke="#2B1D14" stroke-width="1.6" opacity=".35" stroke-linecap="round"/>
  <path d="M0,214 C20,208 40,220 60,214 S100,208 120,214" fill="none" stroke="#2B1D14" stroke-width="1.6" opacity=".25" stroke-linecap="round"/>
  <!-- camino -->
  <use href="#camino" fill="none" stroke="#2B1D14" stroke-width="9" opacity=".10" stroke-linecap="round"/>
  <use href="#camino" fill="none" stroke="#8C2F39" stroke-width="2.4" stroke-dasharray="6 7" stroke-linecap="round"/>
  <!-- huellas -->
  <g fill="#2B1D14" opacity=".55">
    <ellipse cx="40" cy="188" rx="3.4" ry="5.2" transform="rotate(-70 40 188)"/>
    <ellipse cx="54" cy="180" rx="3.4" ry="5.2" transform="rotate(-60 54 180)"/>
    <ellipse cx="88" cy="150" rx="3.4" ry="5.2" transform="rotate(-20 88 150)"/>
    <ellipse cx="146" cy="150" rx="3.4" ry="5.2" transform="rotate(-80 146 150)"/>
    <ellipse cx="226" cy="98" rx="3.4" ry="5.2" transform="rotate(-50 226 98)"/>
    <ellipse cx="272" cy="78" rx="3.4" ry="5.2" transform="rotate(-80 272 78)"/>
  </g>
  <!-- hitos: una piedra romana, una media luna, una pluma, una antena -->
  <g stroke="#8C2F39" stroke-width="1.8" fill="#F4EBD9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="98" y="118" width="12" height="20" rx="1.5"/>
    <path d="M104,122 v12 M101,128 h6"/>
    <path d="M186,106 a9,9 0 1 0 0,18 a7,7 0 1 1 0,-18 z"/>
    <path d="M238,66 c10,-14 20,-16 26,-16 c-2,10 -8,22 -20,24 l-6,2 z M244,74 l-8,8"/>
    <path d="M318,54 v-24 M312,34 l6,-6 l6,6 M308,26 q10,-12 20,0"/>
  </g>
  <!-- punto de llegada -->
  <circle cx="348" cy="22" r="5" fill="#8C2F39"/>
  <circle cx="348" cy="22" r="9" fill="none" stroke="#8C2F39" stroke-width="1.4" opacity=".5"/>
  <!-- punto de salida -->
  <circle cx="14" cy="196" r="4" fill="#2B1D14" opacity=".7"/>
</svg>
